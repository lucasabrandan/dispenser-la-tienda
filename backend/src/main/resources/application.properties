spring.application.name=dispenser-la-tienda
spring.profiles.active=local

# Limites de subida (fotos)
server.tomcat.max-http-form-post-size=15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Ruta de almacenamiento
storage.location=C:/Users/Lucas Brandan/IdeaProjects/proyecto-dispenser/uploads

# JWT — cambiá el secret antes de producción
jwt.secret=D1sp3ns3r-L@-T13nd@-JWT-S3cr3t-K3y-2024-Production-Ultra-Secure-256bit
jwt.expiration=86400000

# Refresh token — se guarda en la tabla refresh_token (RefreshTokenService),
# a diferencia del JWT de arriba. 30 dias en ms, con ventana deslizante:
# cada vez que se usa para renovar el access token, se extiende de nuevo.
refresh.token.expiration=2592000000

# WhatsApp (UltraMsg) — dejar vacío para deshabilitar
# Setup: https://ultramsg.com → crear instancia → escanear QR → copiar valores
whatsapp.ultramsg.instance-id=
whatsapp.ultramsg.token=

# Web Push (VAPID) — notificaciones push al celu/navegador. Claves reales en
# application-local.properties (no se sube al repo). Vacío acá = deshabilitado.
push.vapid.public-key=
push.vapid.private-key=
push.vapid.subject=
